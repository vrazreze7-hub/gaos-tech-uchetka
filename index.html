<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>GAOS Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#f5f5f7;--muted:#a1a1a6;--faint:#6e6e73;--line:rgba(255,255,255,.1);--accent:#7ec8ff;--soft:#111113;--card:#0c0c0e;--ok:#7dffa3;--wait:#ffd27a;--now:#ff8b7a;--work:#9ecbff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:var(--accent)}
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 420px at 20% -10%,rgba(77,159,255,.18),transparent 60%),radial-gradient(700px 380px at 100% 0%,rgba(120,90,255,.12),transparent 55%),#000}
.gate form{width:min(420px,100%);background:rgba(12,12,14,.86);border:1px solid var(--line);border-radius:28px;padding:36px 28px 28px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(160deg,#d7ecff,#4d9fff 45%,#6a5cff);display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.2) inset}
.mark span{font-weight:700;font-size:13px;letter-spacing:-.04em;color:#041018}
.brandline{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brandline b{font-size:18px;letter-spacing:-.03em}
.brandline small{display:block;color:var(--muted);font-weight:520;font-size:12px;margin-top:2px}
h1{font-size:28px;line-height:1.1;margin:0 0 8px;letter-spacing:-.04em}
.lead{color:var(--muted);margin:0 0 22px;font-size:15px;line-height:1.45}
label{display:block;font-size:12px;color:var(--faint);margin-bottom:8px}
input{width:100%;background:#000;border:1px solid var(--line);border-radius:14px;padding:14px 16px;outline:none}
input:focus{border-color:#4d9fff}
.err{min-height:22px;color:var(--now);font-size:13px;margin:8px 0 0}
.go{margin-top:14px;width:100%;border:0;border-radius:14px;padding:14px;background:#f5f5f7;color:#000;font-weight:640;cursor:pointer}
.app{display:none;min-height:100dvh}
.app.on{display:grid;grid-template-columns:292px 1fr}
.side{position:sticky;top:0;height:100dvh;border-right:1px solid var(--line);padding:22px 16px 24px;background:linear-gradient(180deg,rgba(77,159,255,.06),transparent 180px),#000;overflow:auto}
.side .brandline{padding:0 8px}
.who{display:flex;width:100%;text-align:left;gap:10px;align-items:center;border:0;background:transparent;border-radius:16px;padding:11px 12px;cursor:pointer;margin:2px 0}
.who:hover{background:rgba(255,255,255,.04)}
.who.on{background:#16161a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.ava{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#1c1c20;color:#d7ecff;font-size:12px;font-weight:700;flex:none}
.who b{display:block;font-size:14px}
.who small{color:var(--faint);font-size:12px}
.badge{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.main{padding:28px 28px 80px;background:radial-gradient(800px 300px at 80% -40px,rgba(77,159,255,.08),transparent 50%),#000}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:22px}
.head h2{margin:0;font-size:clamp(28px,4vw,44px);letter-spacing:-.045em}
.head p{margin:6px 0 0;color:var(--muted);font-size:15px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;color:var(--muted);cursor:pointer}
.filters button.on{color:var(--ink);border-color:transparent;background:#1d1d1f}
.grid{display:grid;gap:12px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 80px),var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.card button.top{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;text-align:left;background:transparent;border:0;padding:18px 18px 16px;cursor:pointer}
.num{font-variant-numeric:tabular-nums;color:var(--faint);font-size:13px;padding-top:3px}
.card h3{margin:0 0 8px;font-size:17px;letter-spacing:-.02em;font-weight:640}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:12px;border-radius:999px;padding:4px 9px;background:#1a1a1e;color:var(--muted)}
.pill.work{color:var(--work)} .pill.wait{color:var(--wait)} .pill.today{color:var(--now)} .pill.open{color:var(--ok)}
.due{color:var(--faint);font-size:12px}
.body{display:none;padding:0 18px 18px 52px}
.card.open .body{display:block}
.note{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 12px}
ol{margin:0;padding:0 0 0 18px;color:var(--ink)}
li{margin:7px 0;line-height:1.45;font-size:14.5px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.links a{font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 10px}
.links a:hover{border-color:var(--accent)}
.foot{margin-top:28px;color:var(--faint);font-size:12px;line-height:1.5;max-width:68ch}
.rail{display:flex;flex-direction:column}
@media(max-width:860px){
 .app.on{display:block}
 .side{position:sticky;top:0;height:auto;z-index:5;border-right:0;border-bottom:1px solid var(--line);display:block;overflow:hidden;padding:12px 12px 10px}
 .side .brandline{display:flex;margin-bottom:10px}
 .rail{flex-direction:row;gap:8px;overflow:auto;padding-bottom:4px}
 .who{min-width:220px}
 .main{padding:18px 14px 64px}
 .body{padding-left:18px}
}
</style>
</head>
<body>
<section class="gate" id="gate">
  <form id="form">
    <div class="brandline"><div class="mark" aria-hidden="true"><span>GT</span></div><div><b>GAOS Tech</b><small>Учётка задач</small></div></div>
    <h1>Вход</h1>
    <p class="lead">Срез на 13 октября. Пароль не хранится на странице.</p>
    <label for="pw">Пароль</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div class="err" id="err" role="status"></div>
    <button class="go" type="submit">Открыть</button>
  </form>
</section>
<section class="app" id="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="head">
      <div><h2 id="title">Команда</h2><p id="sub"></p></div>
      <div class="filters" id="filters"></div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="foot" id="foot"></p>
  </main>
</section>

const STAT = { "в работе":"work", "ждёт":"wait", "сегодня":"today", "без срока":"open" };
let DATA = null;
let person = null;
let filter = "все";
function esc(s){return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function unlock(password){
  const raw = Uint8Array.from(atob(BLOB), c => c.charCodeAt(0));
  const iv = raw.slice(0,12);
  const tag = raw.slice(12,28);
  const data = raw.slice(28);
  const ct = new Uint8Array(data.length + 16);
  ct.set(data, 0); ct.set(tag, data.length);
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(password));
  const key = await crypto.subtle.importKey("raw", digest, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(plain));
}
function initials(name){return name.slice(0,1);}
function renderSide(){
  const side = document.getElementById("side");
  side.innerHTML = `<div class="brandline"><div class="mark"><span>GT</span></div><div><b>GAOS Tech</b><small>13.10.2026</small></div></div><div class="rail">` +
    DATA.people.map(p => {
      const n = (DATA.tasks[p.id]||[]).length;
      return `<button class="who${p.id===person?' on':''}" data-id="${p.id}"><span class="ava">${esc(initials(p.name))}</span><span><b>${esc(p.name)}</b><small>${esc(p.role)}</small></span><span class="badge">${n}</span></button>`;
    }).join("") + "</div>";
  side.querySelectorAll(".who").forEach(b => b.onclick = () => { person = b.dataset.id; filter = "все"; render(); });
}
function renderFilters(cards){
  const kinds = ["все", ...new Set(cards.map(c => c.status))];
  document.getElementById("filters").innerHTML = kinds.map(k => `<button data-f="${esc(k)}" class="${k===filter?'on':''}">${esc(k)}</button>`).join("");
  document.querySelectorAll("#filters button").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
}
function render(){
  const p = DATA.people.find(x => x.id === person);
  document.getElementById("title").textContent = p.name;
  document.getElementById("sub").textContent = p.role;
  const all = DATA.tasks[p.id] || [];
  renderFilters(all);
  const cards = filter === "все" ? all : all.filter(c => c.status === filter);
  document.getElementById("grid").innerHTML = cards.map((c,i) => {
    const cls = STAT[c.status] || "open";
    const steps = (c.steps||[]).map(s => `<li>${esc(s)}</li>`).join("");
    const links = (c.links||[]).map(l => `<a href="${esc(l.href)}" target="_blank" rel="noopener noreferrer">${esc(l.label)}</a>`).join("");
    return `<article class="card"><button class="top" type="button"><span class="num">${String(i+1).padStart(2,"0")}</span><span><h3>${esc(c.title)}</h3><span class="meta"><span class="pill ${cls}">${esc(c.status)}</span><span class="due">${esc(c.id)} · ${esc(c.due)}</span></span></span></button><div class="body"><p class="note">${esc(c.note)}</p>${steps?`<ol>${steps}</ol>`:""}${links?`<div class="links">${links}</div>`:""}</div></article>`;
  }).join("");
  document.querySelectorAll(".card .top").forEach(btn => btn.onclick = () => btn.parentElement.classList.toggle("open"));
  document.getElementById("foot").textContent = DATA.window + " " + DATA.limits;
  renderSide();
}
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  const pw = document.getElementById("pw").value;
  try {
    DATA = await unlock(pw);
    person = DATA.people[0].id;
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").classList.add("on");
    render();
  } catch (ex) {
    err.textContent = "Не сходится.";
  }
});
</script>
