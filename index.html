<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>GAOS Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#f5f5f7;--muted:#86868b;--faint:#a8d4f5;--line:rgba(255,255,255,.14);--card:#050505;--work:#d7e6ff;--wait:#f0e2c0;--now:#f0ccc6;--open:#d7eadc}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Inter,sans-serif;font-weight:300;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-synthesis:none;text-rendering:optimizeLegibility}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ink)}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.gate{min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));overflow:auto;background:#000}
.gate form{width:min(400px,100%);background:#000;border:1px solid var(--line);border-radius:18px;padding:40px 32px 28px}
.brandline{display:flex;align-items:center;gap:12px}
.mark{width:28px;height:28px;flex:none;color:var(--ink);display:block}
.word{display:flex;align-items:baseline;gap:8px;line-height:1}
.gaos{font-weight:400;font-size:14px;letter-spacing:.14em}
.tech{font-weight:300;font-size:15px;letter-spacing:.04em;color:var(--faint)}
.brandline small{display:block;margin-top:5px;color:var(--faint);font-weight:300;font-size:14px;letter-spacing:.02em}
.gate .brandline{margin-bottom:28px}
.gate .mark{width:34px;height:34px}
.gate .gaos,.gate .tech{font-size:16px}
h1{font-size:40px;line-height:1.05;margin:0 0 10px;font-weight:300;letter-spacing:-.03em}
.lead{color:var(--muted);margin:0 0 26px;font-size:15px;line-height:1.45;font-weight:300}
label{display:block;font-size:14px;font-weight:300;color:var(--faint);margin-bottom:8px;letter-spacing:.04em}
input{width:100%;background:#000;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:16px;font-weight:300;outline:none}
input:focus{border-color:rgba(255,255,255,.45)}
.err{min-height:22px;color:#e7b1aa;font-size:13px;font-weight:300;margin:8px 0 0}
.go{margin-top:14px;width:100%;border:0;border-radius:12px;padding:14px;background:#f5f5f7;color:#000;font-weight:400;letter-spacing:-.01em}
.app{display:none;min-height:100dvh}
.app.on{display:grid;grid-template-columns:248px minmax(0,1fr)}
.side{position:sticky;top:0;height:100dvh;border-right:1px solid var(--line);padding:22px 14px 24px;background:#000;overflow:auto}
.side .brandline{padding:0 8px;margin-bottom:18px}
.rail{display:flex;flex-direction:column}
.who{display:flex;width:100%;text-align:left;gap:10px;align-items:center;border:0;background:transparent;border-radius:12px;padding:8px 10px;margin:1px 0;min-height:48px}
.who:hover{background:rgba(255,255,255,.04)}
.who.on{background:#111;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.ava{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink);font-size:12px;font-weight:400;flex:none}
.who b{display:block;font-size:14px;font-weight:400;letter-spacing:-.01em}
.who small{display:block;color:var(--faint);font-size:14px;font-weight:300;line-height:1.3;margin-top:1px}
.badge{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--faint);font-size:14px;font-weight:300;flex:none}
.main{min-width:0;padding:32px 32px 88px}
.sheet{max-width:860px}
.head{display:flex;flex-direction:column;align-items:flex-start;gap:14px;margin-bottom:18px}
.head h2{margin:0;font-size:clamp(32px,4vw,44px);font-weight:300;letter-spacing:-.034em;line-height:1.05}
.head p{margin:6px 0 0;color:var(--faint);font-size:16px;font-weight:300}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;min-height:34px;color:var(--faint);font-size:14px;font-weight:300}
.filters button.on{color:var(--ink);border-color:rgba(255,255,255,.45)}
.grid{display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card.open{border-color:rgba(255,255,255,.28)}
.card button.top{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 10px;align-items:start;text-align:left;background:transparent;border:0;padding:16px 16px 14px}
.num{font-variant-numeric:tabular-nums;color:var(--faint);font-size:14px;font-weight:300;padding-top:3px}
.card h3{margin:0 0 8px;font-size:17px;letter-spacing:-.02em;font-weight:400;line-height:1.3;overflow-wrap:anywhere}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:13px;font-weight:300;border-radius:999px;padding:3px 8px;border:1px solid var(--line);color:var(--faint)}
.pill.work{color:var(--work)} .pill.wait{color:var(--wait)} .pill.today{color:var(--now)} .pill.open{color:var(--open)}
.due{color:var(--faint);font-size:14px;font-weight:300;overflow-wrap:anywhere}
.reveal{display:block;margin-top:10px;color:var(--faint);font-size:14px;font-weight:300;letter-spacing:.02em}
.body{display:none;padding:0 16px 16px 60px}
.card.open .body{display:block;box-shadow:inset 0 1px 0 var(--line);padding-top:14px}
.note{color:var(--muted);font-size:14px;font-weight:300;line-height:1.55;margin:0 0 12px;white-space:pre-wrap;overflow-wrap:anywhere}
ol{margin:0;padding:0 0 0 18px;color:var(--ink)}
li{margin:7px 0;line-height:1.45;font-size:14.5px;font-weight:300;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.links a{font-size:13px;font-weight:300;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 10px;max-width:100%;overflow-wrap:anywhere}
.links a:hover{border-color:rgba(255,255,255,.4)}
.foot{margin-top:28px;color:var(--faint);font-size:14px;font-weight:300;line-height:1.5;max-width:68ch}
@media(max-width:980px){
 .app.on{display:block}
 .side{position:sticky;top:0;height:auto;z-index:5;border-right:0;border-bottom:1px solid var(--line);padding:max(12px,env(safe-area-inset-top)) 12px 8px;background:#000}
 .side .brandline{margin-bottom:10px}
 .rail{flex-direction:row;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;padding:0 2px 8px}
 .who{width:auto;min-width:196px;scroll-snap-align:start}
 .main{padding:18px 16px max(64px,env(safe-area-inset-bottom))}
 .body,.card.open .body{padding-left:16px;padding-right:16px}
}
@media(max-width:980px) and (max-height:520px){
 .side{display:flex;align-items:center;gap:12px;padding:8px 10px}
 .side .brandline{margin:0;flex:none}
 .side .brandline small{display:none}
 .side .mark{width:22px;height:22px}
 .rail{flex:1;min-width:0;padding-bottom:0}
 .who{min-width:128px;min-height:40px;padding:4px 8px}
 .who small{display:none}
}
@media(min-width:1280px){
 .sheet{max-width:1120px}
 .grid{grid-template-columns:1fr 1fr;align-items:start}
 .card.open{grid-column:1 / -1}
}
@media(max-width:380px){
 .gate form{padding:28px 18px 20px}
 .gate .gaos,.gate .tech{font-size:15px}
 h1{font-size:34px}
 .who{min-width:168px}
 .card h3{font-size:16px}
 .head h2{font-size:30px}
}
@media(min-width:981px) and (max-width:1180px){
 .app.on{grid-template-columns:220px minmax(0,1fr)}
 .main{padding:24px 20px 80px}
}
</style>
</head>
<body>
<section class="gate" id="gate">
  <form id="form">
    <div class="brandline">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.25"/><path d="M14.31 8.15 19.55 17.1"/><path d="M9.69 8.15h9.05"/><path d="M7.55 12.05 12.7 3.35"/><path d="M9.69 15.85 4.45 6.9"/><path d="M14.31 15.85H5.35"/><path d="M16.45 12.05 11.3 20.7"/></svg>
      <div><div class="word"><span class="gaos">GAOS</span><span class="tech">Tech</span></div><small>Учётка задач</small></div>
    </div>
    <h1>Вход</h1>
    <p class="lead">Срез на 13 октября. Пароль не хранится на странице.</p>
    <label for="pw">Пароль</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div class="err" id="err" role="status"></div>
    <button class="go" type="submit">Открыть</button>
  </form>
</section>
<section class="app" id="app">
  <aside class="side" id="side"></aside>
  <main class="main"><div class="sheet">
    <div class="head">
      <div><h2 id="title">Команда</h2><p id="sub"></p></div>
      <div class="filters" id="filters"></div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="foot" id="foot"></p>
  </div></main>
</section>

const MARK = `<svg class="mark" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.25"/><path d="M14.31 8.15 19.55 17.1"/><path d="M9.69 8.15h9.05"/><path d="M7.55 12.05 12.7 3.35"/><path d="M9.69 15.85 4.45 6.9"/><path d="M14.31 15.85H5.35"/><path d="M16.45 12.05 11.3 20.7"/></svg>`;
const STAT = { "в работе":"work", "ждёт":"wait", "сегодня":"today", "без срока":"open" };
let DATA = null;
let person = null;
let filter = "все";
function esc(s){return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function unlock(password){
  const raw = Uint8Array.from(atob(BLOB), c => c.charCodeAt(0));
  const iv = raw.slice(0,12);
  const tag = raw.slice(12,28);
  const data = raw.slice(28);
  const ct = new Uint8Array(data.length + 16);
  ct.set(data, 0); ct.set(tag, data.length);
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(password));
  const key = await crypto.subtle.importKey("raw", digest, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(plain));
}
function initials(name){return name.slice(0,1);}
function renderSide(){
  const side = document.getElementById("side");
  side.innerHTML = `<div class="brandline">${MARK}<div><div class="word"><span class="gaos">GAOS</span><span class="tech">Tech</span></div><small>${esc(DATA.updated)}</small></div></div><div class="rail">` +
    DATA.people.map(p => {
      const n = (DATA.tasks[p.id]||[]).length;
      return `<button class="who${p.id===person?' on':''}" data-id="${esc(p.id)}"><span class="ava">${esc(initials(p.name))}</span><span><b>${esc(p.name)}</b><small>${esc(p.role)}</small></span><span class="badge">${n}</span></button>`;
    }).join("") + "</div>";
  side.querySelectorAll(".who").forEach(b => b.onclick = () => { person = b.dataset.id; filter = "все"; render(); });
}
function renderFilters(cards){
  const kinds = ["все", ...new Set(cards.map(c => c.status))];
  document.getElementById("filters").innerHTML = kinds.map(k => `<button data-f="${esc(k)}" class="${k===filter?'on':''}">${esc(k)}</button>`).join("");
  document.querySelectorAll("#filters button").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
}
function render(){
  const p = DATA.people.find(x => x.id === person);
  document.getElementById("title").textContent = p.name;
  document.getElementById("sub").textContent = p.role;
  const all = DATA.tasks[p.id] || [];
  renderFilters(all);
  const cards = filter === "все" ? all : all.filter(c => c.status === filter);
  document.getElementById("grid").innerHTML = cards.map((c,i) => {
    const cls = STAT[c.status] || "open";
    const steps = (c.steps||[]).map(s => `<li>${esc(s)}</li>`).join("");
    const links = (c.links||[]).map(l => `<a href="${esc(l.href)}" target="_blank" rel="noopener noreferrer">${esc(l.label)}</a>`).join("");
    const can = Boolean((c.note||"").trim() || steps || links);
    const reveal = can ? `<span class="reveal">раскрыть содержимое</span>` : "";
    return `<article class="card"><button class="top" type="button" aria-expanded="false"><span class="num">${String(i+1).padStart(2,"0")}</span><span><h3>${esc(c.title)}</h3><span class="meta"><span class="pill ${cls}">${esc(c.status)}</span><span class="due">${esc(c.id)} · ${esc(c.due)}</span></span>${reveal}</span></button><div class="body"><p class="note">${esc(c.note||"")}</p>${steps?`<ol>${steps}</ol>`:""}${links?`<div class="links">${links}</div>`:""}</div></article>`;
  }).join("");
  document.querySelectorAll(".card .top").forEach(btn => btn.onclick = () => {
    const card = btn.parentElement;
    const open = card.classList.toggle("open");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    const rev = btn.querySelector(".reveal");
    if (rev) rev.textContent = open ? "скрыть содержимое" : "раскрыть содержимое";
  });
  document.getElementById("foot").textContent = DATA.window + " " + DATA.limits;
  renderSide();
}
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  const pw = document.getElementById("pw").value;
  try {
    DATA = await unlock(pw);
    person = DATA.people[0].id;
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").classList.add("on");
    render();
  } catch (ex) {
    err.textContent = "Не сходится.";
  }
});
</script>
